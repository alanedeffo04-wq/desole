<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pour toi ♥</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="fond" id="fond" aria-hidden="true"></div>

<main class="carte">
  <div class="couple" id="couple" aria-hidden="true"></div>

  <section class="scene active" id="s1">
    <h1 id="titre1"></h1>
    <p class="msg" id="msg1"></p>
    <button class="suite" id="btnSuite">Continuer ♥</button>
  </section>

  <section class="scene" id="s2">
    <h1 id="question"></h1>
    <p id="rappel" aria-live="polite"></p>
    <div class="choix">
      <button class="oui" id="oui">Oui ♥</button>
      <button class="non" id="non">Non</button>
    </div>
  </section>

  <section class="scene" id="s3">
    <h1 id="titre3"></h1>
    <p class="msg centre" id="msg3"></p>
    <video controls playsinline preload="metadata">
      <source src="video.mp4" type="video/mp4">
    </video>
    <div class="dl">
      <a class="btn" href="vid%C3%A9o.mp4" download="vidéo.mp4">Télécharger la vidéo</a>
      <button class="btn" id="btnPdf">Télécharger ma lettre (PDF)</button>
    </div>
  </section>
</main>

<!-- ✏️ ÉCRIS TA LETTRE ICI (entre les deux balises). Évite les emojis : ils n'apparaissent pas dans le PDF. -->
<textarea id="lettre" hidden>

« Celui qui trouve une femme trouve le bonheur, c’est une grâce qu’il obtient de l’Éternel. » (Proverbes 18:22)

</textarea>

<script src="script.js"></script>
</body>
</html>
